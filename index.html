<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">
  <title>Day Quality</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    
    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      font-family: 'Outfit', -apple-system, sans-serif;
      color: #e2e8f0;
      padding: 20px;
      padding-top: env(safe-area-inset-top, 20px);
      padding-bottom: calc(env(safe-area-inset-bottom, 20px) + 20px);
    }
    
    .container {
      max-width: 440px;
      margin: 0 auto;
    }
    
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    
    .header h1 {
      font-size: 28px;
      font-weight: 700;
      margin: 0 0 4px;
      background: linear-gradient(135deg, #fff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .header .date {
      color: #64748b;
      font-size: 14px;
    }
    
    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
    }
    
    .nav {
      display: flex;
      padding: 6px;
      margin-bottom: 24px;
    }
    
    .nav-btn {
      flex: 1;
      padding: 10px 20px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .nav-btn.active {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }
    
    .view { display: none; }
    .view.active { display: block; }
    
    .score-card {
      padding: 32px 24px;
      margin-bottom: 20px;
    }
    
    .score-ring {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      margin: 0 auto 24px;
    }
    
    .score-ring::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      padding: 6px;
      background: conic-gradient(from 180deg, var(--ring-color) var(--progress), rgba(255,255,255,0.1) var(--progress));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
    }
    
    .score-grade {
      font-family: 'Space Mono', monospace;
      font-size: 48px;
      font-weight: 700;
    }
    
    .score-points {
      font-family: 'Space Mono', monospace;
      font-size: 18px;
      color: #94a3b8;
      margin-top: 4px;
    }
    
    .score-label {
      text-align: center;
      font-size: 16px;
      font-weight: 500;
    }
    
    .section-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin: 24px 0 12px;
    }
    
    .section-title.positive { color: #34d399; }
    .section-title.negative { color: #f87171; }
    
    .habit-row {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      margin: 8px 0;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .habit-row:hover, .habit-row:active {
      background: rgba(255, 255, 255, 0.05);
    }
    
    .habit-row.checked {
      background: rgba(16, 185, 129, 0.1);
      border-color: rgba(16, 185, 129, 0.3);
    }
    
    .habit-row.checked.negative {
      background: rgba(239, 68, 68, 0.1);
      border-color: rgba(239, 68, 68, 0.3);
    }
    
    .checkbox {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      margin-right: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }
    
    .checkbox.checked {
      background: #10b981;
      border-color: #10b981;
    }
    
    .checkbox.checked.negative {
      background: #ef4444;
      border-color: #ef4444;
    }
    
    .checkbox .check { display: none; color: #fff; font-size: 14px; }
    .checkbox.checked .check { display: block; }
    
    .habit-name {
      font-size: 15px;
      font-weight: 500;
      flex: 1;
    }
    
    .points-badge {
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
    }
    
    .points-badge.positive {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
    }
    
    .points-badge.negative {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
    }
    
    .primary-btn {
      width: 100%;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      border: none;
      border-radius: 10px;
      padding: 16px 24px;
      color: #fff;
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 24px;
    }
    
    .primary-btn:active {
      transform: scale(0.98);
    }
    
    .input-field {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 12px 16px;
      color: #e2e8f0;
      font-family: 'Outfit', sans-serif;
      font-size: 16px;
      width: 100%;
      outline: none;
      transition: all 0.2s ease;
    }
    
    .input-field:focus {
      border-color: rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.08);
    }
    
    .add-form {
      padding: 20px;
      margin-bottom: 20px;
    }
    
    .add-form h3 {
      margin: 0 0 16px;
      font-size: 16px;
      font-weight: 600;
    }
    
    .toggle-group {
      display: flex;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      padding: 4px;
      margin: 12px 0;
    }
    
    .toggle-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: #94a3b8;
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .toggle-btn.active {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }
    
    .points-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    
    .points-row label {
      font-size: 14px;
      color: #94a3b8;
    }
    
    .points-row input {
      width: 100px;
    }
    
    .edit-btn {
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      padding: 8px;
      margin-left: 8px;
      border-radius: 6px;
      font-size: 16px;
    }
    
    .edit-btn:active {
      background: rgba(255, 255, 255, 0.1);
    }
    
    .edit-btn.delete { color: #ef4444; }
    
    .habit-edit-row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex: 1;
    }
    
    .habit-edit-row input {
      font-size: 14px;
      padding: 8px 12px;
    }
    
    .habit-edit-row .input-field.name { flex: 1; }
    .habit-edit-row .input-field.points { width: 70px; }
    
    .save-btn {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      color: #fff;
      font-family: 'Outfit', sans-serif;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    
    .history-card {
      display: flex;
      align-items: center;
      padding: 16px;
      margin: 10px 0;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    .grade-circle {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Space Mono', monospace;
      font-size: 20px;
      font-weight: 700;
      margin-right: 16px;
      flex-shrink: 0;
    }
    
    .history-info { flex: 1; }
    .history-info .date { margin: 0 0 4px; font-weight: 500; }
    .history-info .points { margin: 0; color: #64748b; font-size: 13px; }
    
    .empty-state {
      padding: 20px;
      text-align: center;
      color: #64748b;
      font-size: 14px;
    }
    
    .footer {
      text-align: center;
      color: #475569;
      font-size: 12px;
      margin-top: 32px;
      padding: 16px;
    }
    
    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(16, 185, 129, 0.9);
      color: #fff;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 1000;
    }
    
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Day Quality</h1>
      <p class="date" id="currentDate"></p>
    </div>
    
    <nav class="glass-card nav">
      <button class="nav-btn active" data-view="today">Today</button>
      <button class="nav-btn" data-view="habits">Habits</button>
      <button class="nav-btn" data-view="history">History</button>
    </nav>
    
    <!-- Today View -->
    <div id="todayView" class="view active">
      <div class="glass-card score-card">
        <div class="score-ring" id="scoreRing">
          <span class="score-grade" id="scoreGrade">C</span>
          <span class="score-points" id="scorePoints">0 pts</span>
        </div>
        <p class="score-label" id="scoreLabel">Average</p>
      </div>
      
      <p class="section-title positive">✦ Positive Habits</p>
      <div id="positiveHabits"></div>
      
      <p class="section-title negative">✦ Negative Habits</p>
      <div id="negativeHabits"></div>
      
      <button class="primary-btn" id="saveDay">Save Today's Score</button>
    </div>
    
    <!-- Habits View -->
    <div id="habitsView" class="view">
      <div class="glass-card add-form">
        <h3>Add New Habit</h3>
        <input type="text" class="input-field" id="newHabitName" placeholder="Habit name...">
        <div class="toggle-group">
          <button class="toggle-btn active" data-category="positive">✦ Positive</button>
          <button class="toggle-btn" data-category="negative">✦ Negative</button>
        </div>
        <div class="points-row">
          <label>Points:</label>
          <input type="number" class="input-field" id="newHabitPoints" value="10" min="1" max="100">
        </div>
        <button class="primary-btn" id="addHabit" style="margin-top: 0;">Add Habit</button>
      </div>
      
      <p class="section-title positive">✦ Positive Habits</p>
      <div id="editPositiveHabits"></div>
      
      <p class="section-title negative">✦ Negative Habits</p>
      <div id="editNegativeHabits"></div>
    </div>
    
    <!-- History View -->
    <div id="historyView" class="view">
      <div class="glass-card empty-state" id="historyEmpty">
        No days recorded yet. Complete today and save!
      </div>
      <div id="historyList"></div>
    </div>
    
    <p class="footer" id="footer"></p>
  </div>
  
  <div class="toast" id="toast">Saved!</div>
  
  <script>
    // Default habits
    const defaultHabits = [
      { id: 1, name: 'Morning workout', points: 15, category: 'positive' },
      { id: 2, name: 'Read 30 minutes', points: 10, category: 'positive' },
      { id: 3, name: '8 hours sleep', points: 12, category: 'positive' },
      { id: 4, name: 'Meditate', points: 8, category: 'positive' },
      { id: 5, name: 'Ate junk food', points: -10, category: 'negative' },
      { id: 6, name: 'Skipped workout', points: -12, category: 'negative' },
      { id: 7, name: 'Doom scrolled 1hr+', points: -8, category: 'negative' },
    ];
    
    // State
    let habits = JSON.parse(localStorage.getItem('dq_habits')) || defaultHabits;
    let history = JSON.parse(localStorage.getItem('dq_history')) || [];
    let todayChecked = JSON.parse(localStorage.getItem('dq_today')) || {};
    let newHabitCategory = 'positive';
    let editingHabitId = null;
    
    // Check if today's data is stale (from a previous day)
    const todayKey = new Date().toISOString().split('T')[0];
    const savedTodayKey = localStorage.getItem('dq_today_date');
    if (savedTodayKey !== todayKey) {
      todayChecked = {};
      localStorage.setItem('dq_today', JSON.stringify(todayChecked));
      localStorage.setItem('dq_today_date', todayKey);
    }
    
    // Helpers
    const save = () => {
      localStorage.setItem('dq_habits', JSON.stringify(habits));
      localStorage.setItem('dq_history', JSON.stringify(history));
      localStorage.setItem('dq_today', JSON.stringify(todayChecked));
    };
    
    const showToast = (message) => {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    };
    
    const getScoreInfo = (score) => {
      const maxScore = habits.filter(h => h.points > 0).reduce((s, h) => s + h.points, 0);
      const minScore = habits.filter(h => h.points < 0).reduce((s, h) => s + h.points, 0);
      const percentage = maxScore === minScore ? 50 : ((score - minScore) / (maxScore - minScore)) * 100;
      
      if (percentage >= 85) return { grade: 'A', color: '#10b981', label: 'Excellent' };
      if (percentage >= 70) return { grade: 'B', color: '#22c55e', label: 'Good' };
      if (percentage >= 55) return { grade: 'C', color: '#eab308', label: 'Average' };
      if (percentage >= 40) return { grade: 'D', color: '#f97316', label: 'Below Average' };
      return { grade: 'F', color: '#ef4444', label: 'Poor' };
    };
    
    const calculateScore = () => {
      return Object.entries(todayChecked).reduce((total, [id, checked]) => {
        if (checked) {
          const habit = habits.find(h => h.id === parseInt(id));
          return total + (habit?.points || 0);
        }
        return total;
      }, 0);
    };
    
    // Render functions
    const renderScore = () => {
      const score = calculateScore();
      const info = getScoreInfo(score);
      const maxScore = habits.filter(h => h.points > 0).reduce((s, h) => s + h.points, 0);
      const minScore = habits.filter(h => h.points < 0).reduce((s, h) => s + h.points, 0);
      const progress = maxScore === minScore ? 0 : Math.max(0, ((score - minScore) / (maxScore - minScore)) * 100);
      
      document.getElementById('scoreGrade').textContent = info.grade;
      document.getElementById('scoreGrade').style.color = info.color;
      document.getElementById('scorePoints').textContent = `${score} pts`;
      document.getElementById('scoreLabel').textContent = info.label;
      document.getElementById('scoreLabel').style.color = info.color;
      
      const ring = document.getElementById('scoreRing');
      ring.style.setProperty('--ring-color', info.color);
      ring.style.setProperty('--progress', `${progress}%`);
      
      document.getElementById('footer').textContent = `Score range: ${minScore} to +${maxScore} pts`;
    };
    
    const renderHabitRow = (habit, forEdit = false) => {
      const isChecked = todayChecked[habit.id];
      const isNegative = habit.points < 0;
      const isEditing = editingHabitId === habit.id;
      
      if (forEdit && isEditing) {
        return `
          <div class="habit-row" style="cursor: default;">
            <div class="habit-edit-row">
              <input type="text" class="input-field name" id="editName${habit.id}" value="${habit.name}">
              <input type="number" class="input-field points" id="editPoints${habit.id}" value="${Math.abs(habit.points)}">
              <button class="save-btn" onclick="saveHabitEdit(${habit.id}, ${isNegative})">Save</button>
              <button class="edit-btn delete" onclick="deleteHabit(${habit.id})">🗑</button>
            </div>
          </div>
        `;
      }
      
      if (forEdit) {
        return `
          <div class="habit-row" style="cursor: default;">
            <span class="habit-name">${habit.name}</span>
            <span class="points-badge ${isNegative ? 'negative' : 'positive'}">${isNegative ? '' : '+'}${habit.points}</span>
            <button class="edit-btn" onclick="startEditHabit(${habit.id})">✎</button>
          </div>
        `;
      }
      
      return `
        <div class="habit-row ${isChecked ? 'checked' : ''} ${isNegative && isChecked ? 'negative' : ''}" onclick="toggleHabit(${habit.id})">
          <div class="checkbox ${isChecked ? 'checked' : ''} ${isNegative && isChecked ? 'negative' : ''}">
            <span class="check">✓</span>
          </div>
          <span class="habit-name">${habit.name}</span>
          <span class="points-badge ${isNegative ? 'negative' : 'positive'}">${isNegative ? '' : '+'}${habit.points}</span>
        </div>
      `;
    };
    
    const renderTodayView = () => {
      const positive = habits.filter(h => h.points > 0);
      const negative = habits.filter(h => h.points < 0);
      
      document.getElementById('positiveHabits').innerHTML = positive.map(h => renderHabitRow(h)).join('');
      document.getElementById('negativeHabits').innerHTML = negative.map(h => renderHabitRow(h)).join('');
      renderScore();
    };
    
    const renderHabitsView = () => {
      const positive = habits.filter(h => h.points > 0);
      const negative = habits.filter(h => h.points < 0);
      
      document.getElementById('editPositiveHabits').innerHTML = positive.map(h => renderHabitRow(h, true)).join('');
      document.getElementById('editNegativeHabits').innerHTML = negative.map(h => renderHabitRow(h, true)).join('');
    };
    
    const renderHistoryView = () => {
      const empty = document.getElementById('historyEmpty');
      const list = document.getElementById('historyList');
      
      if (history.length === 0) {
        empty.style.display = 'block';
        list.innerHTML = '';
        return;
      }
      
      empty.style.display = 'none';
      list.innerHTML = history.map(day => {
        const info = getScoreInfo(day.score);
        return `
          <div class="history-card">
            <div class="grade-circle" style="background: ${info.color}20; color: ${info.color};">
              ${day.grade}
            </div>
            <div class="history-info">
              <p class="date">${day.displayDate}</p>
              <p class="points">${day.score} points</p>
            </div>
          </div>
        `;
      }).join('');
    };
    
    // Actions
    window.toggleHabit = (id) => {
      todayChecked[id] = !todayChecked[id];
      save();
      renderTodayView();
    };
    
    window.startEditHabit = (id) => {
      editingHabitId = id;
      renderHabitsView();
    };
    
    window.saveHabitEdit = (id, isNegative) => {
      const name = document.getElementById(`editName${id}`).value.trim();
      const points = parseInt(document.getElementById(`editPoints${id}`).value) || 1;
      
      if (!name) return;
      
      habits = habits.map(h => h.id === id ? {
        ...h,
        name,
        points: isNegative ? -Math.abs(points) : Math.abs(points)
      } : h);
      
      editingHabitId = null;
      save();
      renderHabitsView();
      renderScore();
      showToast('Habit updated!');
    };
    
    window.deleteHabit = (id) => {
      if (confirm('Delete this habit?')) {
        habits = habits.filter(h => h.id !== id);
        delete todayChecked[id];
        editingHabitId = null;
        save();
        renderHabitsView();
        renderTodayView();
        showToast('Habit deleted');
      }
    };
    
    // Event listeners
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(`${btn.dataset.view}View`).classList.add('active');
        
        if (btn.dataset.view === 'habits') renderHabitsView();
        if (btn.dataset.view === 'history') renderHistoryView();
      });
    });
    
    document.querySelectorAll('.toggle-btn[data-category]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.toggle-btn[data-category]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        newHabitCategory = btn.dataset.category;
      });
    });
    
    document.getElementById('addHabit').addEventListener('click', () => {
      const name = document.getElementById('newHabitName').value.trim();
      const points = parseInt(document.getElementById('newHabitPoints').value) || 10;
      
      if (!name) {
        showToast('Enter a habit name');
        return;
      }
      
      const newHabit = {
        id: Date.now(),
        name,
        points: newHabitCategory === 'negative' ? -Math.abs(points) : Math.abs(points),
        category: newHabitCategory
      };
      
      habits.push(newHabit);
      save();
      
      document.getElementById('newHabitName').value = '';
      document.getElementById('newHabitPoints').value = '10';
      
      renderHabitsView();
      renderTodayView();
      showToast('Habit added!');
    });
    
    document.getElementById('saveDay').addEventListener('click', () => {
      const score = calculateScore();
      const info = getScoreInfo(score);
      const today = new Date();
      const dateKey = today.toISOString().split('T')[0];
      const displayDate = today.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
      
      const entry = {
        date: dateKey,
        displayDate,
        score,
        grade: info.grade,
        habits: { ...todayChecked }
      };
      
      // Remove existing entry for today if exists
      history = history.filter(h => h.date !== dateKey);
      history.unshift(entry);
      
      save();
      showToast('Day saved!');
    });
    
    // Init
    const today = new Date();
    document.getElementById('currentDate').textContent = today.toLocaleDateString('en-US', { 
      weekday: 'long', month: 'short', day: 'numeric' 
    });
    
    renderTodayView();
  </script>
</body>
</html>
